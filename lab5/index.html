<!DOCTYPE html>
<html>
    <head>
        <title>Bank Account</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div id="player-card">
            <h2>Bank Account</h2>

            <p>Current Balance: <span id="account-balance">$1000</span></p>
            <p id="status-message"></p>

            <button id="deposit-button" onclick="takeDeposit()">Deposit</button>
            <button id="withdraw-button" onclick="takeWithdraw()">Withdraw</button>
        </div>

        <script src="script.js"></script>
    </body>
</html>
